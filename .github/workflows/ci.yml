name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: Go API
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kingmalhare
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: kingmalhare_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kingmalhare"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://kingmalhare:test-password@localhost:5432/kingmalhare_test?sslmode=disable
      TEST_DATABASE_URL: postgres://kingmalhare:test-password@localhost:5432/kingmalhare_test?sslmode=disable
      REDIS_URL: redis://localhost:6379/0
      TEST_REDIS_URL: redis://localhost:6379/15
      SESSION_PEPPER: 0123456789abcdef0123456789abcdef
      CREDENTIAL_ENCRYPTION_KEY: fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210
      WORKER_SERVICE_TOKEN: test-worker-token
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: apps/api/go.sum
      - run: go mod download
      - run: go vet ./...
      - run: go test ./... -race -count=1
      - name: Apply migrations
        run: go run ./cmd/kmctl migrate
      - name: Verify migrations are idempotent
        run: go run ./cmd/kmctl migrate
      - name: Vulnerability check
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  web:
    name: React console
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test -- --run
      - run: npm run build
      - name: Dependency audit (non-blocking report)
        run: npm audit --omit=dev || true

  worker:
    name: Scanner worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/scanner-workers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/scanner-workers/requirements.txt
      - run: pip install -r requirements.txt ruff
      - run: ruff check --select E9,F .
      - run: python -m pytest -q

  containers:
    name: Container builds
    runs-on: ubuntu-latest
    needs: [api, web, worker]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t king-malhare-api:ci .
      - name: Build web image
        run: docker build -f apps/web/Dockerfile -t king-malhare-web:ci .
      - name: Build worker image
        run: docker build -t king-malhare-worker:ci apps/scanner-workers
      - name: Scan API image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: king-malhare-api:ci
          format: table
          exit-code: "0"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
