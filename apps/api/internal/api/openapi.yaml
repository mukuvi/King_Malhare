openapi: 3.1.0
info:
  title: King Malhare API
  version: 1.0.0
  description: |
    Offensive security and vulnerability assessment platform API.

    Authentication uses the `km_session` HttpOnly cookie for browser sessions plus a
    `X-CSRF-Token` header on mutating requests, or a bearer API key (`km_...`) for
    automation. All tenant data is scoped to the authenticated organization.

    Every scan requires an active authorization record bound to the asset. Intrusive
    scanners additionally require the `scans:intrusive` permission, an authorization
    that permits intrusive testing, and `confirm_intrusive: true`.

    Self-registration is disabled once the deployment has users. The first account
    creates the organization and becomes its owner. Everyone else is added through
    `POST /org/members`.
servers:
  - url: /api/v1
security:
  - sessionCookie: []
  - bearerAuth: []
tags:
  - name: Authentication
  - name: Platform
  - name: Organization
  - name: Assets
  - name: Authorization
  - name: Scans
  - name: Findings
  - name: Intelligence
  - name: Reports
  - name: Operations
paths:
  /health:
    get:
      tags: [Operations]
      summary: Liveness
      security: []
      responses:
        "200": { description: OK }
  /ready:
    get:
      tags: [Operations]
      summary: Readiness (PostgreSQL and Redis)
      security: []
      responses:
        "200": { description: Ready }
        "503": { $ref: '#/components/responses/Error' }
  /openapi.yaml:
    get:
      tags: [Operations]
      summary: This OpenAPI document
      security: []
      responses:
        "200": { description: OpenAPI 3.1 YAML }
  /docs:
    get:
      tags: [Operations]
      summary: Human readable API reference
      security: []
      responses:
        "200": { description: HTML documentation }
  /auth/register:
    post:
      tags: [Authentication]
      summary: Create the first organization and owner account
      description: |
        Succeeds only while the deployment has no users. Once an account exists,
        self-registration returns 403 `registration_disabled` and new members must be
        invited through `POST /org/members`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [org_name, name, email, password]
              properties:
                org_name: { type: string, minLength: 2, maxLength: 120 }
                name: { type: string, minLength: 2, maxLength: 120 }
                email: { type: string, format: email }
                password: { type: string, minLength: 12 }
      responses:
        "200": { description: Session created and owner signed in }
        "403": { $ref: '#/components/responses/Error' }
        "409": { $ref: '#/components/responses/Error' }
        "422": { $ref: '#/components/responses/Error' }
        "429": { $ref: '#/components/responses/Error' }
  /auth/login:
    post:
      tags: [Authentication]
      summary: Sign in and create a session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200": { description: Authenticated }
        "401": { $ref: '#/components/responses/Error' }
        "429": { $ref: '#/components/responses/Error' }
  /auth/logout:
    post:
      tags: [Authentication]
      summary: Revoke the current session
      responses:
        "200": { description: Signed out }
  /auth/me:
    get:
      tags: [Authentication]
      summary: Current user, organization, role and permissions
      responses:
        "200":
          description: Session context
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { type: object }
                  org: { type: object }
                  role: { type: string, enum: [owner, admin, analyst, viewer, api] }
                  permissions: { type: array, items: { type: string } }
                  platform_admin: { type: boolean, description: Cross-organization super admin access }
  /auth/change-password:
    post:
      tags: [Authentication]
      summary: Change password and revoke other sessions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string }
                new_password: { type: string, minLength: 12 }
      responses:
        "200": { description: Password changed }
        "403": { $ref: '#/components/responses/Error' }
        "422": { $ref: '#/components/responses/Error' }
  /me:
    patch:
      tags: [Authentication]
      summary: Update your own display name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 2, maxLength: 120 }
      responses:
        "200": { description: Updated }
        "422": { $ref: '#/components/responses/Error' }
  /platform/overview:
    get:
      tags: [Platform]
      summary: Deployment totals across every organization
      description: Requires a platform administrator account.
      responses:
        "200":
          description: Organization, user, asset, scan and finding totals
          content:
            application/json:
              schema:
                type: object
                properties:
                  organizations: { type: integer }
                  users: { type: integer }
                  active_users: { type: integer }
                  platform_admins: { type: integer }
                  assets: { type: integer }
                  scans: { type: integer }
                  running_scans: { type: integer }
                  findings: { type: integer }
                  high_risk_findings: { type: integer }
        "403": { $ref: '#/components/responses/Error' }
  /platform/organizations:
    get:
      tags: [Platform]
      summary: List every organization with counts and owner
      responses:
        "200": { description: Organizations }
        "403": { $ref: '#/components/responses/Error' }
  /platform/organizations/{orgId}:
    get:
      tags: [Platform]
      summary: Organization detail with members and recent assessments
      parameters:
        - { in: path, name: orgId, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Organization, members and recent scans }
        "403": { $ref: '#/components/responses/Error' }
        "404": { $ref: '#/components/responses/Error' }
  /platform/users:
    get:
      tags: [Platform]
      summary: List every user with their organization memberships
      responses:
        "200": { description: Users }
        "403": { $ref: '#/components/responses/Error' }
  /platform/users/{userId}:
    patch:
      tags: [Platform]
      summary: Activate, deactivate or grant platform admin access
      description: |
        Platform administrators cannot deactivate themselves or remove their own
        platform admin access.
      parameters:
        - { in: path, name: userId, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                is_active: { type: boolean }
                is_platform_admin: { type: boolean }
      responses:
        "200": { description: Updated }
        "403": { $ref: '#/components/responses/Error' }
        "404": { $ref: '#/components/responses/Error' }
        "422": { $ref: '#/components/responses/Error' }
  /platform/activity:
    get:
      tags: [Platform]
      summary: Recent audit events across every organization
      responses:
        "200": { description: Activity items }
        "403": { $ref: '#/components/responses/Error' }
  /stats/overview:
    get:
      tags: [Operations]
      summary: Dashboard statistics computed from PostgreSQL
      responses:
        "200": { description: Asset, scan, finding and posture statistics }
  /stats/trends:
    get:
      tags: [Operations]
      summary: Daily finding and scan trends
      parameters:
        - { in: query, name: days, schema: { type: integer, minimum: 7, maximum: 180, default: 30 } }
      responses:
        "200": { description: Daily series }
  /stats/activity:
    get:
      tags: [Operations]
      summary: Recent organization activity derived from the audit trail
      responses:
        "200": { description: Recent activity items }
  /org:
    get:
      tags: [Organization]
      summary: Organization profile, member count and asset count
      responses:
        "200": { description: Organization }
    patch:
      tags: [Organization]
      summary: Update organization name or retention window
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 2, maxLength: 120 }
                retention_days: { type: integer, minimum: 30, maximum: 3650 }
      responses:
        "200": { description: Updated }
        "422": { $ref: '#/components/responses/Error' }
  /org/members:
    get:
      tags: [Organization]
      summary: List members with role, status and open finding counts
      responses:
        "200": { description: Member list }
    post:
      tags: [Organization]
      summary: Add a member or invite a new person
      description: |
        Existing accounts are added to the organization. A new email creates a user
        with a one-time `temporary_password` that is returned in the response and
        never shown again. The `owner` role cannot be granted through this endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email]
              properties:
                name: { type: string, minLength: 2 }
                email: { type: string, format: email }
                role_id: { type: string, enum: [admin, analyst, viewer], default: analyst }
      responses:
        "201":
          description: Member added
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id: { type: string, format: uuid }
                  created: { type: boolean }
                  temporary_password: { type: string, description: Returned once when a new account is created }
        "403": { $ref: '#/components/responses/Error' }
        "409": { $ref: '#/components/responses/Error' }
        "422": { $ref: '#/components/responses/Error' }
  /org/members/{userId}:
    parameters:
      - { in: path, name: userId, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [Organization]
      summary: Change a member role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role_id]
              properties:
                role_id: { type: string, enum: [admin, analyst, viewer] }
      responses:
        "200": { description: Role changed }
        "403": { $ref: '#/components/responses/Error' }
        "404": { $ref: '#/components/responses/Error' }
        "422": { $ref: '#/components/responses/Error' }
    delete:
      tags: [Organization]
      summary: Remove a member from the organization
      responses:
        "200": { description: Member removed }
        "403": { $ref: '#/components/responses/Error' }
        "404": { $ref: '#/components/responses/Error' }
  /assets:
    get:
      tags: [Assets]
      summary: List assets
      parameters:
        - { in: query, name: page, schema: { type: integer, minimum: 1 }, description: Page number }
        - { in: query, name: per_page, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { in: query, name: search, schema: { type: string } }
        - { in: query, name: type, schema: { type: string, enum: [website, web_app, api, graphql_api, ip, network, cloud, server, container, internal] } }
        - { in: query, name: environment, schema: { type: string, enum: [production, staging, development, lab, internal] } }
        - { in: query, name: status, schema: { type: string, enum: [active, archived] } }
        - { in: query, name: sort, schema: { type: string, enum: [name, created_at, last_assessed_at, risk, type] } }
        - { in: query, name: order, schema: { type: string, enum: [asc, desc] } }
      responses:
        "200": { description: Paginated assets }
    post:
      tags: [Assets]
      summary: Register an asset
      description: |
        Any provider's server can be assessed by registering it as a `server`,
        `website`, `ip` or `network` asset. Native cloud posture checks additionally
        need a cloud connection for AWS, Azure or GCP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, type, target]
              properties:
                name: { type: string }
                type: { type: string, enum: [website, web_app, api, graphql_api, ip, network, cloud, server, container, internal] }
                target: { type: string, description: URL, host, IP, CIDR, cloud account or image reference }
                description: { type: string }
                environment: { type: string, enum: [production, staging, development, lab, internal] }
                owner_user_id: { type: string, format: uuid }
                tags: { type: array, items: { type: string }, maxItems: 20 }
                metadata: { type: object }
      responses:
        "201": { description: Asset created }
        "409": { $ref: '#/components/responses/Error' }
        "422": { $ref: '#/components/responses/Error' }
  /assets/{assetId}:
    parameters:
      - { in: path, name: assetId, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Assets]
      summary: Asset detail with ownership
      responses:
        "200": { description: Asset }
        "404": { $ref: '#/components/responses/Error' }
    patch:
      tags: [Assets]
      summary: Update asset fields
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: string }
                environment: { type: string, enum: [production, staging, development, lab, internal] }
                owner_user_id: { type: string, format: uuid }
                tags: { type: array, items: { type: string } }
                status: { type: string, enum: [active, archived] }
                target: { type: string }
      responses:
        "200": { description: Updated }
    delete:
      tags: [Assets]
      summary: Archive an asset
      responses:
        "200": { description: Archived }
  /assets/{assetId}/authorizations:
    parameters:
      - { in: path, name: assetId, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Authorization]
      summary: List authorization records for an asset
      responses:
        "200": { description: Authorization list }
    post:
      tags: [Authorization]
      summary: Record written authorization for testing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reference, approved_by_name, expires_at]
              properties:
                reference: { type: string, description: Contract, ticket or written approval identifier }
                approved_by_name: { type: string }
                approved_by_email: { type: string }
                scope_notes: { type: string }
                intrusive_allowed: { type: boolean, default: false }
                allow_private: { type: boolean, default: false }
                valid_from: { type: string, format: date-time }
                expires_at: { type: string, format: date-time }
      responses:
        "201": { description: Authorization created }
        "422": { $ref: '#/components/responses/Error' }
  /authorizations/{authorizationId}:
    patch:
      tags: [Authorization]
      summary: Revoke an authorization
      parameters:
        - { in: path, name: authorizationId, required: true, schema: { type: string, format: uuid } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [revoked] }
                reason: { type: string }
      responses:
        "200": { description: Revoked }
  /assets/{assetId}/scans:
    get:
      tags: [Assets]
      summary: List assessments for an asset
      parameters:
        - { in: path, name: assetId, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: page, schema: { type: integer, minimum: 1 } }
        - { in: query, name: per_page, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        "200": { description: Paginated assessments }
  /assets/{assetId}/findings:
    get:
      tags: [Assets]
      summary: List findings for an asset
      parameters:
        - { in: path, name: assetId, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: page, schema: { type: integer, minimum: 1 } }
        - { in: query, name: per_page, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        "200": { description: Paginated findings }
  /scan-profiles:
    get:
      tags: [Scans]
      summary: List system and organization scan profiles
      responses:
        "200": { description: Profiles }
    post:
      tags: [Scans]
      summary: Create a custom scan profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, scanner]
              properties:
                name: { type: string, minLength: 2, maxLength: 120 }
                category: { type: string, enum: [web, network, cloud, authentication, infrastructure] }
                scanner: { type: string }
                description: { type: string }
                config: { type: object }
                key: { type: string, description: Stable profile key. Generated from the name when omitted. }
      responses:
        "201": { description: Created }
        "409": { $ref: '#/components/responses/Error' }
        "422": { $ref: '#/components/responses/Error' }
  /scan-profiles/{profileId}:
    parameters:
      - { in: path, name: profileId, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [Scans]
      summary: Update a custom scan profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, scanner]
              properties:
                name: { type: string }
                category: { type: string, enum: [web, network, cloud, authentication, infrastructure] }
                scanner: { type: string }
                description: { type: string }
                config: { type: object }
      responses:
        "200": { description: Updated }
        "403": { $ref: '#/components/responses/Error' }
        "404": { $ref: '#/components/responses/Error' }
        "422": { $ref: '#/components/responses/Error' }
    delete:
      tags: [Scans]
      summary: Delete a custom scan profile
      responses:
        "200": { description: Deleted }
        "404": { $ref: '#/components/responses/Error' }
  /scanners:
    get:
      tags: [Scans]
      summary: Scanner catalogue and live worker availability
      responses:
        "200": { description: Scanner status, worker heartbeats and queue depth }
  /scans:
    get:
      tags: [Scans]
      summary: List assessments
      parameters:
        - { in: query, name: status, schema: { type: string, enum: [active, pending, queued, initializing, running, completed, failed, cancelled] } }
        - { in: query, name: category, schema: { type: string, enum: [web, network, cloud, authentication, infrastructure] } }
        - { in: query, name: scanner, schema: { type: string } }
        - { in: query, name: asset_id, schema: { type: string, format: uuid } }
        - { in: query, name: page, schema: { type: integer } }
        - { in: query, name: per_page, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        "200": { description: Paginated assessments }
    post:
      tags: [Scans]
      summary: Start an assessment
      description: |
        The target is checked against the asset and authorization record. Private
        targets require an authorization with `allow_private`. Intrusive scanners
        require `scans:intrusive`, an intrusive authorization and
        `confirm_intrusive: true`. Jobs are queued in Redis for a scanner worker.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [asset_id, authorization_id, scanner]
              properties:
                asset_id: { type: string, format: uuid }
                authorization_id: { type: string, format: uuid }
                scanner: { type: string, enum: [http-baseline, nmap, nuclei, zap, nikto, gobuster, testssl, sqlmap, trivy, prowler, scoutsuite, checkov, aws-posture, auth-baseline, burp, ffuf, whatweb, wafw00f, httpx, subfinder, sslyze, grype, semgrep, gitleaks, tfsec, syft, schemathesis] }
                category: { type: string, enum: [web, network, cloud, authentication, infrastructure] }
                profile_id: { type: string, format: uuid }
                params: { type: object }
                confirm_intrusive: { type: boolean, default: false }
                cloud_connection_id: { type: string, format: uuid }
                test_account_password: { type: string, description: Used only by authentication scanners }
                idempotency_key: { type: string }
      responses:
        "202": { description: Queued }
        "403": { $ref: '#/components/responses/Error' }
        "422": { $ref: '#/components/responses/Error' }
        "429": { $ref: '#/components/responses/Error' }
  /scans/compare:
    get:
      tags: [Scans]
      summary: Compare two assessments by finding fingerprint
      parameters:
        - { in: query, name: base, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: compare, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: New, resolved and persisting findings }
  /scans/{scanId}:
    get:
      tags: [Scans]
      summary: Assessment detail, scope, config, executions and severity counts
      parameters:
        - { in: path, name: scanId, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Assessment }
        "404": { $ref: '#/components/responses/Error' }
  /scans/{scanId}/cancel:
    post:
      tags: [Scans]
      summary: Request cancellation
      parameters:
        - { in: path, name: scanId, required: true, schema: { type: string, format: uuid } }
      responses:
        "202": { description: Cancellation requested }
  /scans/{scanId}/events:
    get:
      tags: [Scans]
      summary: Server-Sent Events stream of live progress
      parameters:
        - { in: path, name: scanId, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: text/event-stream with `update` events
          content:
            text/event-stream:
              schema: { type: string }
  /scans/{scanId}/executions:
    get:
      tags: [Scans]
      summary: List scanner execution records for an assessment
      parameters:
        - { in: path, name: scanId, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Execution records }
  /scans/{scanId}/results:
    get:
      tags: [Scans]
      summary: Normalized raw results for a scan
      parameters:
        - { in: path, name: scanId, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Results }
  /scans/{scanId}/findings:
    get:
      tags: [Scans]
      summary: List findings produced by an assessment
      parameters:
        - { in: path, name: scanId, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Findings }
  /scans/emergency-stop:
    post:
      tags: [Scans]
      summary: Cancel every queued and running assessment and block new ones
      responses:
        "200": { description: Emergency stop active }
  /emergency-stop:
    delete:
      tags: [Scans]
      summary: Clear the organization emergency stop
      responses:
        "200": { description: Cleared }
  /findings:
    get:
      tags: [Findings]
      summary: List deduplicated findings
      parameters:
        - { in: query, name: severity, schema: { type: string, enum: [critical, high, medium, low, info] } }
        - { in: query, name: status, schema: { type: string, enum: [open, confirmed, in_progress, fixed, retest_required, accepted_risk, false_positive] } }
        - { in: query, name: asset_id, schema: { type: string, format: uuid } }
        - { in: query, name: assigned_to, schema: { type: string, format: uuid } }
        - { in: query, name: search, schema: { type: string } }
        - { in: query, name: page, schema: { type: integer } }
        - { in: query, name: per_page, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { in: query, name: sort, schema: { type: string, enum: [last_seen, first_seen, severity, status, title] } }
      responses:
        "200": { description: Paginated findings }
  /findings/{findingId}:
    get:
      tags: [Findings]
      summary: Finding detail with evidence and lifecycle events
      parameters:
        - { in: path, name: findingId, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Finding }
        "404": { $ref: '#/components/responses/Error' }
    patch:
      tags: [Findings]
      summary: Triage a finding
      parameters:
        - { in: path, name: findingId, required: true, schema: { type: string, format: uuid } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string, enum: [open, confirmed, in_progress, fixed, retest_required, accepted_risk, false_positive] }
                severity: { type: string, enum: [critical, high, medium, low, info] }
                assigned_to: { type: string, format: uuid }
                description: { type: string }
                reproduction: { type: string }
                business_impact: { type: string }
                technical_impact: { type: string }
                remediation: { type: string }
                note: { type: string }
      responses:
        "200": { description: Updated }
  /findings/{findingId}/verify:
    post:
      tags: [Findings]
      summary: Mark a finding confirmed and verified
      parameters:
        - { in: path, name: findingId, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Verified }
  /findings/{findingId}/remediation:
    post:
      tags: [Findings]
      summary: Record a remediation action for a finding
      parameters:
        - { in: path, name: findingId, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, maxLength: 500 }
                notes: { type: string, maxLength: 5000 }
                deadline: { type: string, format: date-time }
      responses:
        "201": { description: Remediation recorded }
        "404": { $ref: '#/components/responses/Error' }
        "422": { $ref: '#/components/responses/Error' }
  /findings/{findingId}/evidence:
    get:
      tags: [Findings]
      summary: List evidence attachments
      parameters:
        - { in: path, name: findingId, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Evidence metadata }
    post:
      tags: [Findings]
      summary: Upload evidence (PNG, JPEG, WEBP, GIF, PDF, TXT, LOG, JSON, CSV; 25 MB)
      parameters:
        - { in: path, name: findingId, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "201": { description: Stored with SHA-256 }
        "422": { $ref: '#/components/responses/Error' }
  /evidence/{evidenceId}/download:
    get:
      tags: [Findings]
      summary: Download evidence (organization scoped)
      parameters:
        - { in: path, name: evidenceId, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: File }
  /intel/cve/{cveId}:
    get:
      tags: [Intelligence]
      summary: CVE lookup via CIRCL with a local seven-day cache
      parameters:
        - { in: path, name: cveId, required: true, schema: { type: string, pattern: '^CVE-[0-9]{4}-[0-9]{4,7}$' } }
      responses:
        "200": { description: Normalized CVE record }
        "502": { $ref: '#/components/responses/Error' }
  /intel/recent:
    get:
      tags: [Intelligence]
      summary: Recently looked up CVEs from the local cache
      parameters:
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        "200": { description: CVE records }
  /intel/cwes:
    get:
      tags: [Intelligence]
      summary: CWE reference catalogue
      responses:
        "200": { description: CWE list }
  /reports:
    get:
      tags: [Reports]
      summary: List generated reports
      parameters:
        - { in: query, name: page, schema: { type: integer, minimum: 1 } }
        - { in: query, name: per_page, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { in: query, name: status, schema: { type: string } }
        - { in: query, name: search, schema: { type: string } }
      responses:
        "200": { description: Paginated reports }
    post:
      tags: [Reports]
      summary: Generate an HTML and PDF penetration test report
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string }
                client_name: { type: string }
                assessor_name: { type: string }
                scan_id: { type: string, format: uuid }
                finding_ids: { type: array, items: { type: string, format: uuid } }
                period_start: { type: string, format: date-time }
                period_end: { type: string, format: date-time }
      responses:
        "201": { description: Report ready }
        "422": { $ref: '#/components/responses/Error' }
  /reports/{reportId}:
    parameters:
      - { in: path, name: reportId, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Reports]
      summary: Report detail
      responses:
        "200": { description: Report }
        "404": { $ref: '#/components/responses/Error' }
    delete:
      tags: [Reports]
      summary: Delete a report
      responses:
        "200": { description: Deleted }
        "404": { $ref: '#/components/responses/Error' }
  /reports/{reportId}/html:
    get:
      tags: [Reports]
      summary: Render the HTML report inline
      parameters:
        - { in: path, name: reportId, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: HTML report }
  /reports/{reportId}/pdf:
    get:
      tags: [Reports]
      summary: Download the PDF report
      parameters:
        - { in: path, name: reportId, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: PDF report }
  /notifications:
    get:
      tags: [Operations]
      summary: List notifications visible to the current user
      parameters:
        - { in: query, name: unread, schema: { type: boolean, default: false } }
        - { in: query, name: page, schema: { type: integer, minimum: 1 } }
        - { in: query, name: per_page, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        "200": { description: Notifications, total and unread count }
    delete:
      tags: [Operations]
      summary: Clear the current user inbox
      description: |
        Personal notifications are deleted. Organization-wide notifications are
        dismissed for the current user only, so other members keep them.
      responses:
        "200": { description: Inbox cleared }
  /notifications/read:
    post:
      tags: [Operations]
      summary: Mark notifications as read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids: { type: array, items: { type: string, format: uuid }, maxItems: 200 }
                all: { type: boolean, default: false }
      responses:
        "200": { description: Updated }
        "422": { $ref: '#/components/responses/Error' }
  /audit-events:
    get:
      tags: [Operations]
      summary: Organization audit trail
      parameters:
        - { in: query, name: page, schema: { type: integer, minimum: 1 } }
        - { in: query, name: per_page, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { in: query, name: action, schema: { type: string } }
        - { in: query, name: resource_type, schema: { type: string } }
        - { in: query, name: search, schema: { type: string } }
      responses:
        "200": { description: Paginated audit events }
  /integrations:
    get:
      tags: [Operations]
      summary: Scanner availability, workers, queue depth and cloud connections
      responses:
        "200": { description: Integration status }
  /cloud-connections:
    get:
      tags: [Operations]
      summary: List cloud connections (credentials are never returned)
      responses:
        "200": { description: Connections }
    post:
      tags: [Operations]
      summary: Store encrypted read-only cloud credentials
      description: |
        Native posture checks require provider credentials. Server-level assessment
        of any provider, including Contabo, works through assets instead.

        AWS requires `access_key_id`, `secret_access_key` and `region`. Optional
        fields are `session_token`, `role_arn` and `external_id`.
        Azure requires `tenant_id`, `client_id`, `client_secret` and `subscription_id`.
        GCP requires `service_account_json`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, name, credentials]
              properties:
                provider: { type: string, enum: [aws, azure, gcp] }
                name: { type: string, minLength: 2, maxLength: 120 }
                account_id: { type: string }
                credentials:
                  type: object
                  additionalProperties: { type: string }
      responses:
        "201": { description: Stored encrypted }
        "422": { $ref: '#/components/responses/Error' }
  /cloud-connections/{connectionId}:
    parameters:
      - { in: path, name: connectionId, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [Operations]
      summary: Delete a cloud connection
      responses:
        "200": { description: Deleted }
        "404": { $ref: '#/components/responses/Error' }
  /cloud-connections/{connectionId}/validate:
    post:
      tags: [Operations]
      summary: Re-check stored credentials and update verification status
      parameters:
        - { in: path, name: connectionId, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Validation result }
        "404": { $ref: '#/components/responses/Error' }
        "422": { $ref: '#/components/responses/Error' }
  /api-keys:
    get:
      tags: [Operations]
      summary: List API key metadata
      responses:
        "200": { description: Keys }
    post:
      tags: [Operations]
      summary: Issue an API key (token shown once)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 2, maxLength: 120 }
                scopes: { type: array, items: { type: string }, maxItems: 30, description: Defaults to every permission the caller holds }
                expires_in_days: { type: integer, minimum: 1, maximum: 730 }
      responses:
        "201": { description: Token issued }
        "403": { $ref: '#/components/responses/Error' }
        "422": { $ref: '#/components/responses/Error' }
  /api-keys/{keyId}:
    delete:
      tags: [Operations]
      summary: Revoke an API key
      parameters:
        - { in: path, name: keyId, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Revoked }
        "404": { $ref: '#/components/responses/Error' }
  /schedules:
    get:
      tags: [Operations]
      summary: List scheduled assessments
      responses:
        "200": { description: Schedules }
    post:
      tags: [Operations]
      summary: Schedule a non-intrusive assessment (five-field cron, UTC)
      description: |
        Intrusive scanners and cloud assessments cannot be scheduled. The asset and
        authorization must exist, belong to the organization, and be active.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [asset_id, authorization_id, scanner, cron]
              properties:
                asset_id: { type: string, format: uuid }
                authorization_id: { type: string, format: uuid }
                scanner: { type: string }
                category: { type: string }
                profile_id: { type: string, format: uuid }
                config: { type: object }
                cron: { type: string, example: "0 3 * * 1" }
                enabled: { type: boolean, default: true }
      responses:
        "201": { description: Scheduled }
        "422": { $ref: '#/components/responses/Error' }
  /schedules/{scheduleId}:
    parameters:
      - { in: path, name: scheduleId, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [Operations]
      summary: Update a schedule cron or enabled state
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                cron: { type: string }
                enabled: { type: boolean }
      responses:
        "200": { description: Updated }
        "422": { $ref: '#/components/responses/Error' }
    delete:
      tags: [Operations]
      summary: Delete a schedule
      responses:
        "200": { description: Deleted }
        "404": { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: km_session
    bearerAuth:
      type: http
      scheme: bearer
      description: "API key prefixed with km_, created under Integrations."
  responses:
    Error:
      description: Typed error
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  code: { type: string }
                  message: { type: string }
                  details: { type: object }
