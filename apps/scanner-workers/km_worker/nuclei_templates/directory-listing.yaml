id: km-directory-listing
info:
  name: Directory Listing Enabled
  author: king-malhare
  severity: medium
  description: The web server returns a directory index, exposing file names and potentially sensitive artefacts.
  remediation: Disable automatic directory indexing in the web server configuration.
  tags: exposure,misconfig
  classification:
    cwe-id: CWE-548
http:
  - method: GET
    path:
      - "{{BaseURL}}/uploads/"
      - "{{BaseURL}}/backup/"
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        words:
          - "Index of /"
        part: body
